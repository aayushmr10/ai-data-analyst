services:
  backend:
    build: ./backend
    container_name: ada-backend
    ports:
      - "8000:8000"
    environment:
      # Optional. Without a key everything works except the AI analyst tabs.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_MAX_STEPS: ${LLM_MAX_STEPS:-8}
    volumes:
      - backend_reports:/app/reports_output
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ada-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_reports:
